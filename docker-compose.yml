version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://johndoe:randompassword@db:5432/abch_db?schema=public}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change-this-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-https://ticket.abchospitaleg.com}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-johndoe}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-randompassword}
      - POSTGRES_DB=${POSTGRES_DB:-abch_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abch_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
