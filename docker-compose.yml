services:
  app:
    build: .
    ports:
      - "${PORT:-3007}:${PORT:-3007}"
    environment:
      - PORT=${PORT:-3007}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-da7170c2230eb55275bf0cd1af41b04d190bcde3ab21a2c3bad4dfff8d7f5130}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-1f8476ac224859e20ebaaaa23badd84393426bac2d92a408807938f06f8677cd}
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3007}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  uploads_data:
