version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://johndoe:randompassword@db:5432/abch_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=change-this-in-production
      - JWT_REFRESH_SECRET=change-this-refresh-secret
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=johndoe
      - POSTGRES_PASSWORD=randompassword
      - POSTGRES_DB=abch_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
